[workspace]
resolver = "3"
members = ["nut_webgui", "crates/*"]

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
panic = "abort"

[workspace.package]
version = "0.10.3"
edition = "2024"
authors = ["Timur Olur <pm@smdd.dev>"]
documentation = "nwg.smdd.dev"
homepage = "https://codeberg.org/SuperiorOne/nut_webgui"
keywords = ["nut", "ups", "network-ups-tools", "self-hosted", "management"]
license = "Apache-2.0"
repository = "https://codeberg.org/SuperiorOne/nut_webgui"

[workspace.dependencies]
upsmc = { path = "./crates/upsmc" }
tsdb = { path = "./crates/tsdb" }
nut_webgui_client = { path = "./crates/nut_webgui_client" }
